job:
  name: rag_nightly_update
  schedule: "0 0 1 * * ?"       # Quartz cron — 01:00 UTC daily
  timezone: UTC
  timeout_seconds: 10800         # 3 h — safely within the 01:00–04:00 window

  # Job-level parameters are automatically available in every task via
  # dbutils.widgets.get("<name>").  Edit values here; re-run deploy_job.py.
  parameters:
    RAW_PAPERS_VPATH:       /Volumes/workspace/default/publications
    PARSED_PAPERS_TPATH:    workspace.default.parsed_papers
    CHUNKED_PAPERS_TPATH:   workspace.default.chunked_papers
    MIN_CHUNK_SIZE:         "50"
    VECTOR_SEARCH_ENDPOINT: academic_search_endpoint
    VECTOR_SEARCH_INDEX:    workspace.default.publication_index
    EMBEDDING_MODEL:        databricks-gte-large-en
    EMBEDDING_COLUMN:       chunk_text
    PRIMARY_KEY:            chunk_id
    LLM_ENDPOINT:           databricks-meta-llama-3-3-70b-instruct
    NUM_RESULTS:            "10"
    REGISTERED_MODEL_NAME:  workspace.default.research_assistant
    SERVING_ENDPOINT_NAME:  research_assistant_endpoint
    EVAL_TABLE:             workspace.default.truth_table_converted
    MLFLOW_EXPERIMENT:      /Shared/research_assistant
    NUM_EVALS:              "20"

  # DAG — list tasks in any order; depends_on drives execution order.
  tasks:
    - task_key:  parse_publications
      script:    parse_publications.py
      depends_on: []

    - task_key:  chunk_publications
      script:    chunk_publications.py
      depends_on: [parse_publications]

    - task_key:  create_vector_index
      script:    create_vector_index.py
      depends_on: [chunk_publications]
      pip: [databricks-vectorsearch]

    - task_key:  generate_truth_table     # runs in parallel with create_vector_index
      script:    generate_truth_table.py
      depends_on: [chunk_publications]
      pip: [databricks-agents]

    - task_key:  evaluate_rag
      script:    evaluate_rag.py
      depends_on: [create_vector_index, generate_truth_table]
      pip: [databricks-vectorsearch, mlflow]
